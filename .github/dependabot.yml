version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Disable routine version PRs; security updates remain enabled.
    open-pull-requests-limit: 0
    groups:
      react-security:
        applies-to: security-updates
        patterns:
          - react
          - react-dom
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
